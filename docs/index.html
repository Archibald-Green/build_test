<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      name="description"
      content="Статическая платформа для прохождения тренировочных тестов."
      data-i18n-content="shell.description"
    >
    <title>OpenTest</title>
    <link rel="icon" href="data:,">
    <link
      rel="stylesheet"
      href="./assets/css/styles.css?v=20260612-multiple-choice"
    >
    <script
      type="module"
      src="./assets/js/public/app.js?v=20260612-multiple-choice"
    ></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content" data-i18n="shell.skipToContent">
      Перейти к содержимому
    </a>

    <header class="site-header">
      <div class="site-header__inner page-width">
        <a
          class="brand"
          href="./"
          aria-label="Главная страница OpenTest"
          data-i18n-aria-label="shell.homeLabel"
        >
          <span class="brand__mark" aria-hidden="true">O</span>
          <span>OpenTest</span>
        </a>

        <nav
          class="site-nav"
          aria-label="Основная навигация"
          data-i18n-aria-label="shell.primaryNavigation"
        >
          <a href="./" data-i18n="shell.availableTests">Доступные тесты</a>
          <a href="#about" data-i18n="shell.about">О платформе</a>
        </nav>

        <div
          id="language-switcher"
          class="language-switcher"
          role="group"
          aria-label="Язык интерфейса"
        >
          <button type="button" data-locale="ru" aria-pressed="true">
            Русский
          </button>
          <button type="button" data-locale="kk" aria-pressed="false">
            Қазақша
          </button>
          <button type="button" data-locale="en" aria-pressed="false">
            English
          </button>
        </div>
      </div>
    </header>

    <main id="main-content" class="site-main" tabindex="-1">
      <div class="page-width">
        <div id="app" aria-live="polite" aria-busy="true">
          <section class="status-panel" aria-labelledby="loading-title">
            <span class="loading-indicator" aria-hidden="true"></span>
            <div>
              <p class="status-panel__label" data-i18n="shell.loadingLabel">
                Загрузка
              </p>
              <h1 id="loading-title" data-i18n="shell.loadingTitle">
                Подготавливаем каталог тестов
              </h1>
              <p data-i18n="shell.loadingMessage">
                Загружаем актуальный каталог с этого сайта.
              </p>
            </div>
          </section>
        </div>
      </div>
    </main>

    <footer id="about" class="site-footer">
      <div class="site-footer__inner page-width">
        <p data-i18n="shell.footerPlatform">Статическая тестовая платформа</p>
        <p data-i18n="shell.footerAccount">Регистрация не требуется</p>
      </div>
    </footer>

    <noscript>
      <div class="noscript-message">
        Для загрузки каталога тестов OpenTest требуется JavaScript.
      </div>
    </noscript>
  </body>
</html>
